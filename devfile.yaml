schemaVersion: 2.3.0
metadata:
  name: openshift-devspaces-python-jupyter
  version: 1.0.0
  description: "Python and Jupyter Notebook environment with automatic Git repository setup for OpenShift Dev Spaces"
  displayName: Python Jupyter Dev Environment
  tags:
    - Python
    - Jupyter
    - Data Science

# --------------------------------------------------------
# Definition of Project (Git Repository)
# --------------------------------------------------------
projects:
  - name: python-app # directory name cloned in the workspace
    git:
      remotes:
        origin: "https://github.com/taisyo7333/example-python.git"
      checkoutFrom:
        revision: main # Cloning Branch or tag (e.g: main, master, develop, v1.0.0 and so on)

components:
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.28.2
      memoryLimit: 4G
      memoryRequest: 1G
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: jupyter-lab
          targetPort: 8888
          exposure: public
          protocol: http
          secure: false

commands:
  - id: setup-python-env
    exec:
      component: dev-tools
      workingDir: ${PROJECTS_ROOT}/python-app
      commandLine: |
        python -m pip install --upgrade pip && \
        pip install jupyterlab notebook ipykernel pandas numpy
      group:
        kind: build
        isDefault: true

  - id: run-jupyter-lab
    exec:
      component: dev-tools
      workingDir: ${PROJECTS_ROOT}/python-app
      commandLine: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
      group:
        kind: run
        isDefault: false